<<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Country Guesser</title>

<style>

* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    margin: 0;
    min-height: 100vh;

    background:
        linear-gradient(
            to bottom,
            #5ac8fa,
            white
        );

    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.game-box {
    width: min(1000px, 92vw);

    min-height: 650px;

    margin: 30px auto;

    padding: clamp(25px, 4vw, 55px);

    background:
        rgba(255,255,255,0.96);

    border-radius: 30px;

    box-shadow:
        0 20px 60px
        rgba(0,0,0,0.25);

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;
}

h1 {
    font-size:
        clamp(36px, 5vw, 64px);

    margin: 0 0 10px;
}

#difficultyDisplay {
    color: #555;

    margin-top: 0;
}

.stats {
    width: 100%;

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 12px;

    background: #f1f5f9;

    padding: 15px;

    border-radius: 18px;

    margin-bottom: 20px;
}

.stat {
    background: white;

    padding: 12px;

    border-radius: 12px;

    box-shadow:
        0 3px 10px
        rgba(0,0,0,0.08);
}

.xp-box {
    width: min(650px,95%);

    background: #f3f7fb;

    padding: 14px 18px;

    border-radius: 16px;

    margin-bottom: 12px;
}

#levelText {
    font-size: 20px;
    font-weight: bold;
}

.xp-bar {
    height: 22px;

    width: 100%;

    margin-top: 9px;

    background: #d8dde3;

    border-radius: 20px;

    overflow: hidden;
}

#xpFill {
    height: 100%;

    width: 0%;

    background:
        linear-gradient(
            to right,
            #36c66f,
            #ffd84d
        );

    transition:
        width 0.4s;
}

#xpText {
    margin-top: 8px;

    color: #555;
}

.rank-box {
    width: min(650px,95%);

    padding: 12px;

    background: white;

    border-radius: 15px;

    margin-bottom: 12px;

    box-shadow:
        0 3px 12px
        rgba(0,0,0,0.1);
}

#rankText {
    font-size: 21px;

    font-weight: bold;
}

.rewards-box {
    width: min(700px,95%);

    padding: 16px;

    background: #f5f8fc;

    border-radius: 20px;

    margin-bottom: 22px;
}

.rewards-title {
    font-size: 22px;

    font-weight: bold;
}

#playtime {
    margin: 6px 0 12px;

    color: #555;
}

.reward-grid {
    display: grid;

    grid-template-columns:
        repeat(4,1fr);

    gap: 9px;
}

.reward {
    background: #dde4eb;

    color: #555;

    padding: 12px 5px;

    border: none;

    border-radius: 12px;

    cursor: default;
}

.reward span {
    display: block;

    margin-top: 4px;

    font-size: 12px;
}

.reward.ready {
    background: #63df7c;

    color: #123b1c;

    cursor: pointer;

    animation:
        rewardGlow 1s
        infinite alternate;
}

.reward.claimed {
    background: #b8bec5;

    color: white;
}

@keyframes rewardGlow {

    from {
        transform: scale(1);
    }

    to {
        transform: scale(1.04);
    }
}

.clue {
    width: 90%;

    padding: 13px;

    margin: 8px auto;

    border-radius: 12px;

    font-size:
        clamp(18px,2vw,25px);
}

#clue1 {
    background: #eef7ff;
}

#clue2 {
    background: #fff7dc;
}

#clue3 {
    background: #ffecec;
}

.clue:empty {
    display: none;
}

#guess {
    width: min(500px,85%);

    padding: 16px;

    font-size: 20px;

    border: 2px solid #aaa;

    border-radius: 14px;

    text-align: center;

    outline: none;
}

#guess:focus {
    border-color: #1687ff;

    box-shadow:
        0 0 0 4px
        rgba(22,135,255,0.15);
}

button {
    border: none;

    border-radius: 14px;

    padding: 14px 28px;

    font-size: 18px;

    cursor: pointer;

    transition: 0.15s;
}

button:hover {
    transform: scale(1.05);
}

#check {
    margin-top: 18px;

    background: #1687ff;

    color: white;

    font-weight: bold;
}

#levelScreen {
    position: fixed;

    inset: 0;

    background:
        linear-gradient(
            to bottom,
            #5ac8fa,
            white
        );

    display: flex;

    justify-content: center;

    align-items: center;

    z-index: 20;
}

.level-box {

    padding:
        clamp(30px,5vw,60px);

        0 20px 70px

.level-button {

}

.easy {

}

.medium {
    background: #ffd34e;
}

.hard {
    background: #ff6464;

}

.popup {
    display: none;

    inset: 0;

    background:
        rgba(0,0,0,0.6);

    justify-content: center;

    align-items: center;

}

.popup.show {

}

.popup-box {

    }

    }
}

@media(max-width:700px) {

    }

    }

    }

    .reward-grid {

            repeat(2,1fr);
    }

</style>
</head>

/* =========================
   COUNTRY HELPERS
========================= */

function normalizedName(name) {

    return name
        .toLowerCase()
        .normalize("NFD")
        .replace(
            /[\u0300-\u036f]/g,
            ""
        )
        .replace(
            /[^a-z0-9 ]/g,
            ""
        )
        .replace(
            /\s+/g,
            " "
        )
        .trim();

}


function letterCount(name) {

    return name
        .replace(
            /[^a-zA-Z]/g,
            ""
        )
        .length;

}


function wordCount(name) {

    return name
        .trim()
        .split(/\s+/)
        .length;

}


function vowelCount(name) {

    const matches =
        name
            .toLowerCase()
            .match(/[aeiou]/g);


    return matches ?
        matches.length :
        0;

}


function firstLetter(name) {

    return name
        .charAt(0)
        .toUpperCase();

}


function lastLetter(name) {

    const clean =
        name.replace(
            /[^a-zA-Z]/g,
            ""
        );


    return clean
        .charAt(
            clean.length - 1
        )
        .toUpperCase();

}


/* =========================
   GENERATE CLUES
========================= */

function getClues(country) {

    const name =
        country.name;


    if (
        difficulty === "easy"
    ) {

        return [

            "This country is in " +
            country.continent,

            "Its name starts with the letter " +
            firstLetter(name),

            "Its name has " +
            letterCount(name) +
            " letters"

        ];

    }


    if (
        difficulty === "medium"
    ) {

        return [

            "This country is in " +
            country.continent,

            "Its name ends with the letter " +
            lastLetter(name),

            "Its name has " +
            wordCount(name) +
            (
                wordCount(name) === 1 ?
                " word" :
                " words"
            )

        ];

    }


    return [

        "Its name contains " +
        vowelCount(name) +
        " vowels",

        "Its first letter is " +
        firstLetter(name) +
        " and its last letter is " +
        lastLetter(name),

        "Its name contains " +
        letterCount(name) +
        " letters and " +
        wordCount(name) +
        (
            wordCount(name) === 1 ?
            " word" :
            " words"
        )

    ];

}


/* =========================
   PICK COUNTRY
========================= */

function pickCountry() {

    let available =
        countries.filter(
            function(country) {

                return !usedCountries
                    .includes(
                        country.name
                    );

            }
        );


    if (
        available.length === 0
    ) {

        usedCountries =
            [];

        available =
            countries;

    }


    answer =
        available[
            Math.floor(
                Math.random() *
                available.length
            )
        ];


    usedCountries.push(
        answer.name
    );

}

        "difficultyDisplay"
    ).textContent =
        "Difficulty: " +
        difficulty
            .charAt(0)
            .toUpperCase() +
        difficulty.slice(1) +
        " • 197 Countries";

}


/* =========================
   POPUP
========================= */

function showPopup(
    title,
    message,
    button
) {

    popupTitle.textContent =
        title;


    popupMessage.textContent =
        message;


    popupButton.textContent =
        button;


    popup.classList.add(
        "show"
    );

}


function closePopup() {

    popup.classList.remove(
        "show"
    );

}


/* =========================
   START GAME
========================= */

function startGame() {

    score =
        0;

    round =
        1;

    wrongGuesses =
        0;

    streak =
        0;

    bestStreak =
        0;

    gameOver =
        false;

    usedCountries =
        [];


    guess.disabled =
        false;

    check.disabled =
        false;

    guess.value =
        "";


    closePopup();

    pickCountry();

    showCountry();

    updateStats();

    updateXPDisplay();

    guess.focus();

}


/* =========================
   FINISH GAME
========================= */

function finishGame() {

    gameOver =
        true;


    guess.disabled =
        true;

    check.disabled =
        true;


    let highScore =
        getHighScore();


    let xpEarned =
        Math.floor(
            score / 10
        );


    if (
        difficulty ===
        "medium"
    ) {

        xpEarned =
            Math.floor(
                xpEarned *
                1.25
            );

    }


    if (
        difficulty ===
        "hard"
    ) {

        xpEarned =
            Math.floor(
                xpEarned *
                1.5
            );

    }


    const oldLevel =
        playerLevel;


    addXP(
        xpEarned
    );


    let message =
        "Score: " +
        score +
        "\n🔥 Best Streak: " +
        bestStreak +
        "\n✨ +" +
        xpEarned +
        " XP";


    if (
        playerLevel >
        oldLevel
    ) {

        message +=
            "\n\n🎉 LEVEL UP!" +
            "\nYou are now Level " +
            playerLevel +
            "!";

    }


    if (
        score >
        highScore
    ) {

        saveHighScore(
            score
        );


        showPopup(
            "🏆 NEW HIGH SCORE! 🏆",
            message +
            "\n⭐ High Score: " +
            score,
            "Play Again 🔄"
        );

    }

    else {

        showPopup(
            "🏁 GAME OVER!",
            message +
            "\n🏆 High Score: " +
            highScore,
            "Play Again 🔄"
        );

    }

}


/* =========================
   POPUP BUTTON
========================= */

popupButton.addEventListener(
    "click",
    function() {

        if (
            gameOver
        ) {

            closePopup();


            levelScreen.style.display =
                "flex";


            return;

        }


        closePopup();

        guess.focus();

    }
);


/* =========================
   CHECK ANSWER
========================= */

check.addEventListener(
    "click",
    function() {

        let playerGuess =
            normalizedName(
                guess.value
            );


        if (
            playerGuess === ""
        ) {

            showPopup(
                "🤔 Type a country!",
                "Enter your guess first.",
                "Okay"
            );

            return;

        }


        if (
            aliases[playerGuess]
        ) {

            playerGuess =
                normalizedName(
                    aliases[
                        playerGuess
                    ]
                );

        }


        const correctAnswer =
            normalizedName(
                answer.name
            );


        if (
            playerGuess ===
            correctAnswer
        ) {

            let points =
                100;


            if (
                wrongGuesses === 0
            ) {

                points =
                    300;

            }

            else if (
                wrongGuesses === 1
            ) {

                points =
                    200;

            }


            streak++;


            bestStreak =
                Math.max(
                    bestStreak,
                    streak
                );


            if (
                streak >= 3
            ) {

                points +=
                    50;

            }


            score +=
                points;


            updateStats();


            if (
                round >=
                maxRounds
            ) {

                finishGame();

                return;

            }


            showPopup(
                "🌎 Correct! 🎉",
                answer.name +
                "!\n\n+" +
                points +
                " points!\n🔥 Streak: " +
                streak,
                "Next Country ➡️"
            );


            round++;

            wrongGuesses =
                0;

            guess.value =
                "";


            pickCountry();

            showCountry();

            updateStats();

        }

        else {

            wrongGuesses++;

            streak =
                0;


            const clues =
                getClues(answer);


            if (
                wrongGuesses === 1
            ) {

                document.getElementById(
                    "clue2"
                ).textContent =
                    "🧩 Clue 2: " +
                    clues[1];


                showPopup(
                    "❌ Not quite!",
                    "Clue 2 unlocked!",
                    "Try Again"
                );

            }

            else if (
                wrongGuesses === 2
            ) {

                document.getElementById(
                    "clue3"
                ).textContent =
                    "🧩 Clue 3: " +
                    clues[2];


                showPopup(
                    "❌ Still not it!",
                    "Clue 3 unlocked!",
                    "Try Again"
                );

            }

            else {

                showPopup(
                    "🤔 Keep trying!",
                    "You have all 3 clues now.",
                    "Try Again"
                );

            }


            updateStats();

        }

    }
);


/* ENTER KEY */

guess.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Enter" &&
            !gameOver &&
            !popup.classList
                .contains("show")
        ) {

            check.click();

        }

    }
);


/* =========================
   PLAYTIME REWARDS
========================= */

let playtimeSeconds =
    0;


let claimedRewards =
    [];


const rewards = [

{
    minutes: 2,
    xp: 100,
    id: "reward2"
},

{
    minutes: 5,
    xp: 200,
    id: "reward5"
},

{
    minutes: 10,
    xp: 350,
    id: "reward10"
},

{
    minutes: 20,
    xp: 600,
    id: "reward20"
}

];


function formatPlaytime(seconds) {

    const minutes =
        Math.floor(
            seconds / 60
        );


    const remaining =
        seconds % 60;


    return (
        minutes +
        ":" +
        (
            remaining < 10 ?
            "0" :
            ""
        ) +
        remaining
    );

}


function updateReward(
    reward
) {

    const button =
        document.getElementById(
            reward.id
        );


    if (
        claimedRewards.includes(
            reward.minutes
        )
    ) {

        button.className =
            "reward claimed";


        button.innerHTML =
            "✅ CLAIMED" +
            "<span>+" +
            reward.xp +
            " XP</span>";


        return;

    }


    if (
        playtimeSeconds >=
        reward.minutes * 60
    ) {

        button.className =
            "reward ready";


        button.innerHTML =
            "🎁 CLAIM!" +
            "<span>+" +
            reward.xp +
            " XP</span>";

    }

    else {

        button.className =
            "reward";


        button.innerHTML =
            "🔒 " +
            reward.minutes +
            " MIN" +
            "<span>+" +
            reward.xp +
            " XP</span>";

    }

}


function updateRewards() {

    document.getElementById(
        "playtime"
    ).textContent =
        "⏱️ Playtime: " +
        formatPlaytime(
            playtimeSeconds
        );


    rewards.forEach(
        updateReward
    );

}


function claimReward(
    reward
) {

    if (
        claimedRewards.includes(
            reward.minutes
        )
    ) {

        return;

    }


    if (
        playtimeSeconds <
        reward.minutes * 60
    ) {

        return;

    }


    claimedRewards.push(
        reward.minutes
    );


    const oldLevel =
        playerLevel;


    addXP(
        reward.xp
    );


    let message =
        "You earned +" +
        reward.xp +
        " XP!";


    if (
        playerLevel >
        oldLevel
    ) {

        message +=
            "\n\n🎉 LEVEL UP!" +
            "\nYou are now Level " +
            playerLevel +
            "!";

    }


    showPopup(
        "🎁 REWARD CLAIMED!",
        message,
        "Awesome! 😎"
    );


    updateRewards();

}


rewards.forEach(
    function(reward) {

        document.getElementById(
            reward.id
        ).addEventListener(
            "click",
            function() {

                claimReward(
                    reward
                );

            }
        );

    }
);


setInterval(
    function() {

        playtimeSeconds++;

        updateRewards();

    },
    1000
);


/* START DISPLAY */

updateXPDisplay();

updateRewards();

</script>
