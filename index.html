<style>

* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;

    background:
        linear-gradient(
            to bottom,
            #5ac8fa,
            white
        );

    min-height: 100vh;

    margin: 0;

    text-align: center;

    display: flex;
    justify-content: center;
    align-items: center;
}


/* =========================
   MAIN GAME
========================= */

.game-box {
    width: min(1000px, 92vw);

    min-height: 650px;

    margin: 30px auto;

    padding: clamp(25px, 4vw, 55px);

    background: rgba(255,255,255,0.96);

    border-radius: 30px;

    box-shadow:
        0 20px 60px rgba(0,0,0,0.25);

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;
}


h1 {
    font-size:
        clamp(36px, 5vw, 64px);

    margin-top: 0;

    margin-bottom: 10px;
}


#difficultyDisplay {
    font-size:
        clamp(18px, 2vw, 24px);

    color: #555;

    margin-top: 0;

    margin-bottom: 20px;
}


/* =========================
   STATS
========================= */

.stats {
    width: 100%;

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 12px;

    background: #f1f5f9;

    border-radius: 18px;

    padding: 15px;

    margin-bottom: 20px;
}


.stat {
    background: white;

    border-radius: 12px;

    padding: 12px;

    font-size:
        clamp(15px, 1.5vw, 20px);

    box-shadow:
        0 3px 10px rgba(0,0,0,0.08);
}


/* =========================
   XP
========================= */

.xp-box {
    width: min(650px, 95%);

    margin-bottom: 12px;

    background: #f3f7fb;

    border-radius: 16px;

    padding: 14px 18px;
}


#levelText {
    font-size: 20px;

    font-weight: bold;
}


.xp-bar {
    width: 100%;

    height: 22px;

    margin-top: 9px;

    background: #d8dde3;

    border-radius: 20px;

    overflow: hidden;
}


#xpFill {
    width: 0%;

    height: 100%;

    background:
        linear-gradient(
            to right,
            #36c66f,
            #ffd84d
        );

    border-radius: 20px;

    transition: width 0.4s;
}


#xpText {
    margin-top: 8px;

    color: #555;
}


/* =========================
   RANK
========================= */

.rank-box {
    width: min(650px, 95%);

    background: white;

    padding: 12px;

    border-radius: 15px;

    margin-bottom: 12px;

    box-shadow:
        0 3px 12px rgba(0,0,0,0.1);
}


#rankText {
    font-size: 21px;

    font-weight: bold;
}


/* =========================
   PLAYTIME REWARDS
========================= */

.rewards-box {
    width: min(700px, 95%);

    background: #f5f8fc;

    padding: 16px;

    border-radius: 20px;

    margin-bottom: 24px;
}


.rewards-title {
    font-size: 22px;

    font-weight: bold;

    margin-bottom: 6px;
}


#playtime {
    color: #555;

    margin-bottom: 12px;
}


.reward-grid {
    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 9px;
}


.reward {
    background: #dde4eb;

    color: #555;

    padding: 12px 5px;

    font-size: 14px;

    border: none;

    border-radius: 12px;

    cursor: default;
}


.reward span {
    display: block;

    font-size: 12px;

    margin-top: 4px;
}


.reward.ready {
    background: #63df7c;

    color: #123b1c;

    cursor: pointer;

    animation:
        rewardGlow 1s
        infinite alternate;
}


.reward.claimed {
    background: #b8bec5;

    color: white;

    animation: none;
}


@keyframes rewardGlow {

    from {
        transform: scale(1);
    }

    to {
        transform: scale(1.04);
    }

}


/* =========================
   CLUES
========================= */

.clue {
    width: 90%;

    font-size:
        clamp(18px, 2vw, 26px);

    line-height: 1.5;

    margin: 8px auto;

    padding: 12px;

    border-radius: 12px;
}


#clue1 {
    background: #eef7ff;
}


#clue2 {
    background: #fff7dc;
}


#clue3 {
    background: #ffecec;
}


.clue:empty {
    display: none;
}


/* =========================
   INPUT
========================= */

#guess {
    width: min(500px, 85%);

    padding: 16px 18px;

    font-size:
        clamp(17px, 2vw, 22px);

    border-radius: 14px;

    border: 2px solid #aaa;

    outline: none;

    text-align: center;
}


#guess:focus {
    border-color: #1687ff;

    box-shadow:
        0 0 0 4px
        rgba(22,135,255,0.15);
}


/* =========================
   BUTTONS
========================= */

button {
    padding: 14px 28px;

    font-size:
        clamp(16px, 1.8vw, 20px);

    border: none;

    border-radius: 14px;

    cursor: pointer;

    transition: 0.15s;
}


button:hover {
    transform: scale(1.05);
}


#check {
    margin-top: 18px;

    background: #1687ff;

    color: white;

    font-weight: bold;
}


/* =========================
   LEVEL SCREEN
========================= */

#levelScreen {
    position: fixed;

    inset: 0;

    background:
        linear-gradient(
            to bottom,
            #5ac8fa,
            white
        );

    display: flex;

    justify-content: center;

    align-items: center;

    z-index: 20;
}


.level-box {
    background: white;

    padding:
        clamp(30px, 5vw, 60px);

    border-radius: 30px;

    width: min(600px, 85vw);

    box-shadow:
        0 20px 70px
        rgba(0,0,0,0.3);
}


.level-button {
    display: block;

    width: 100%;

    margin: 15px 0;

    padding: 18px;

    font-size: 21px;

    font-weight: bold;
}


.easy {
    background: #63df7c;
}


.medium {
    background: #ffd34e;
}


.hard {
    background: #ff6464;

    color: white;
}


/* =========================
   POPUP
========================= */

.popup {
    display: none;

    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,0.6);

    justify-content: center;

    align-items: center;

    z-index: 9999;
}


.popup.show {
    display: flex;
}


.popup-box {
    background: white;

    width: min(450px, 85vw);

    padding: 40px;

    border-radius: 25px;

    box-shadow:

.popup-box h2 {

}


.popup-box p {
    font-size: 19px;

}


#popupButton {
    background: #1687ff;

    color: white;

    font-weight: bold;
}


@keyframes popIn {

    from {
        transform: scale(0.7);

        opacity: 0;
    }

    to {
        transform: scale(1);

        opacity: 1;
    }

}


/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    }

    }


    #guess {

    }

}

</style>

/* =========================
   GAME VARIABLES
========================= */

let difficulty = "easy";

let answer;

let score = 0;

let round = 1;

let wrongGuesses = 0;

let streak = 0;

let bestStreak = 0;

let gameOver = false;

let usedCountries = [];

const maxRounds = 10;



/* =========================
   XP
========================= */

let playerLevel =
    Number(
        localStorage.getItem(
            "countryPlayerLevel"
        )
    ) || 1;


let playerXP =
    Number(
        localStorage.getItem(
            "countryPlayerXP"
        )
    ) || 0;



function xpNeeded() {

    return 500 +
        ((playerLevel - 1) * 150);

}



function savePlayer() {

    localStorage.setItem(
        "countryPlayerLevel",
        playerLevel
    );


    localStorage.setItem(
        "countryPlayerXP",
        playerXP
    );

}



function updateRank() {

    let rank;


    if (playerLevel >= 25) {

        rank =
            "👑 Geography Legend";

    }

    else if (
        playerLevel >= 15
    ) {

        rank =
            "🏆 World Master";

    }

    else if (
        playerLevel >= 10
    ) {

        rank =
            "🌎 Geographer";

    }

    else if (
        playerLevel >= 6
    ) {

        rank =
            "🗺️ Navigator";

    }

    else if (
        playerLevel >= 3
    ) {

        rank =
            "🧭 Explorer";

    }

    else {

        rank =
            "🌱 Rookie";

    }


    document.getElementById(
        "rankText"
    ).textContent =
        rank;

}



function updateXPDisplay() {

    const needed =
        xpNeeded();


    levelText.textContent =
        "⭐ Player Level " +
        playerLevel;


    xpText.textContent =
        playerXP +
        " / " +
        needed +
        " XP";


    let percent =
        (playerXP / needed) * 100;


    if (percent > 100) {

        percent = 100;

    }


    xpFill.style.width =
        percent + "%";


    updateRank();

}



function addXP(amount) {

    playerXP += amount;


    while (
        playerXP >= xpNeeded()
    ) {

        playerXP -=
            xpNeeded();

        playerLevel++;

    }


    savePlayer();

    updateXPDisplay();

}



/* =========================
   LEVEL BUTTONS
========================= */

easyButton.addEventListener(
    "click",
    function() {

        chooseDifficulty("easy");

    }
);


mediumButton.addEventListener(
    "click",
    function() {

        chooseDifficulty("medium");

    }
);


hardButton.addEventListener(
    "click",
    function() {

        chooseDifficulty("hard");

    }
);



function chooseDifficulty(level) {

    difficulty = level;

    levelScreen.style.display =
        "none";

    startGame();

}



/* =========================
   HIGH SCORE
========================= */

function getHighScore() {

    return Number(
        localStorage.getItem(
            "countryGuesserHighScore_" +
            difficulty
        )
    ) || 0;

}



function saveHighScore(newScore) {

    localStorage.setItem(
        "countryGuesserHighScore_" +
        difficulty,
        newScore
    );

}



/* =========================
   COUNTRIES
========================= */

function pickCountry() {

    let availableCountries =
        countries.filter(
            function(country) {

                return !usedCountries
                    .includes(
                        country.name
                    );

            }
        );


    if (
        availableCountries.length === 0
    ) {

        usedCountries = [];

        availableCountries =
            countries;

    }


    const randomNumber =
        Math.floor(
            Math.random() *
            availableCountries.length
        );


    answer =
        availableCountries[
            randomNumber
        ];


    usedCountries.push(
        answer.name
    );

}



function showCountry() {

    const clues =
        answer[difficulty];


    document.getElementById(
        "clue1"
    ).textContent =
        "🧩 Clue 1: " +
        clues[0];


    document.getElementById(
        "clue2"
    ).textContent =
        "";


    document.getElementById(
        "clue3"
    ).textContent =
        "";

}



/* =========================
   STATS
========================= */

function updateStats() {

    document.getElementById(
        "score"
    ).textContent =
        "⭐ Score: " +
        score;


    document.getElementById(
        "round"
    ).textContent =
        "🌎 Round: " +
        round +
        " / " +
        maxRounds;


    document.getElementById(
        "streak"
    ).textContent =
        "🔥 Streak: " +
        streak;


    let difficultyName =
        difficulty
            .charAt(0)
            .toUpperCase() +
        difficulty.slice(1);


    document.getElementById(
        "difficultyDisplay"
    ).textContent =
        "Difficulty: " +
        difficultyName;

}



/* =========================
   POPUPS
========================= */

function showPopup(
    title,
    message,
    buttonText
) {

    popupTitle.textContent =
        title;


    popupMessage.textContent =
        message;


    popupButton.textContent =
        buttonText;


    popup.classList.add(
        "show"
    );

}



function closePopup() {

    popup.classList.remove(
        "show"
    );

}



/* =========================
   GAME START
========================= */

function startGame() {

    score = 0;

    round = 1;

    streak = 0;

    bestStreak = 0;

    wrongGuesses = 0;

    gameOver = false;

    usedCountries = [];


    guess.disabled =
        false;


    check.disabled =
        false;


    guess.value =
        "";


    closePopup();


    pickCountry();

    showCountry();

    updateStats();

    updateXPDisplay();


    guess.focus();

}



/* =========================
   GAME OVER
========================= */

function finishGame() {

    gameOver = true;


    guess.disabled =
        true;


    check.disabled =
        true;


    let highScore =
        getHighScore();


    let xpEarned =
        Math.floor(
            score / 10
        );


    if (
        difficulty === "medium"
    ) {

        xpEarned =
            Math.floor(
                xpEarned * 1.25
            );

    }


    if (
        difficulty === "hard"
    ) {

        xpEarned =
            Math.floor(
                xpEarned * 1.5
            );

    }


    const oldLevel =
        playerLevel;


    addXP(
        xpEarned
    );


    let message =
        "Score: " +
        score +
        "\n🔥 Best Streak: " +
        bestStreak +
        "\n✨ +" +
        xpEarned +
        " XP";


    if (
        playerLevel >
        oldLevel
    ) {

        message +=
            "\n\n🎉 LEVEL UP!" +
            "\nYou are now Level " +
            playerLevel +
            "!";

    }


    if (
        score > highScore
    ) {

        saveHighScore(
            score
        );


        showPopup(
            "🏆 NEW HIGH SCORE! 🏆",
            message +
            "\n⭐ High Score: " +
            score,
            "Play Again 🔄"
        );

    }

    else {

        showPopup(
            "🏁 GAME OVER!",
            message +
            "\n🏆 High Score: " +
            highScore,
            "Play Again 🔄"
        );

    }

}



/* =========================
   POPUP BUTTON
========================= */

popupButton.addEventListener(
    "click",
    function() {

        if (gameOver) {

            closePopup();


            levelScreen.style.display =
                "flex";


            return;

        }


        closePopup();


        guess.focus();

    }
);



/* =========================
   CHECK ANSWER
========================= */

check.addEventListener(
    "click",
    function() {

        const playerGuess =
            guess.value
                .toLowerCase()
                .trim();


        if (
            playerGuess === ""
        ) {

            showPopup(
                "🤔 Type a country!",
                "Enter your guess first.",
                "Okay"
            );


            return;

        }



        if (
            playerGuess ===
            answer.name
        ) {

            let pointsEarned =
                100;


            if (
                wrongGuesses === 0
            ) {

                pointsEarned =
                    300;

            }

            else if (
                wrongGuesses === 1
            ) {

                pointsEarned =
                    200;

            }


            streak++;


            if (
                streak >
                bestStreak
            ) {

                bestStreak =
                    streak;

            }


            if (
                streak >= 3
            ) {

                pointsEarned +=
                    50;

            }


            score +=
                pointsEarned;


            updateStats();



            if (
                round >=
                maxRounds
            ) {

                finishGame();

                return;

            }



            showPopup(
                "🌎 Correct! 🎉",
                "+" +
                pointsEarned +
                " points!" +
                "\n🔥 Streak: " +
                streak,
                "Next Country ➡️"
            );


            round++;


            wrongGuesses =
                0;


            guess.value =
                "";


            pickCountry();

            showCountry();

            updateStats();

        }


        else {

            wrongGuesses++;


            streak =
                0;


            const clues =
                answer[
                    difficulty
                ];


            if (
                wrongGuesses === 1
            ) {

                document.getElementById(
                    "clue2"
                ).textContent =
                    "🧩 Clue 2: " +
                    clues[1];


                showPopup(
                    "❌ Not quite!",
                    "Clue 2 unlocked!",
                    "Try Again"
                );

            }


            else if (
                wrongGuesses === 2
            ) {

                document.getElementById(
                    "clue3"
                ).textContent =
                    "🧩 Clue 3: " +
                    clues[2];


                showPopup(
                    "❌ Still not it!",
                    "Clue 3 unlocked!",
                    "Try Again"
                );

            }


            else {

                showPopup(
                    "🤔 Keep trying!",
                    "You have all 3 clues now.",
                    "Try Again"
                );

            }


            updateStats();

        }

    }
);



/* ENTER KEY */

guess.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Enter" &&
            !gameOver &&
            !popup.classList
                .contains("show")
        ) {

            check.click();

        }

    }
);



/* =========================
   PLAYTIME REWARDS
========================= */

let playtimeSeconds =
    0;


let claimedRewards =
    [];


const rewards = [

    {
        minutes: 2,
        xp: 100,
        button: "reward2"
    },

    {
        minutes: 5,
        xp: 200,
        button: "reward5"
    },

    {
        minutes: 10,
        xp: 350,
        button: "reward10"
    },

    {
        minutes: 20,
        xp: 600,
        button: "reward20"
    }

];



function formatPlaytime(seconds) {

    const minutes =
        Math.floor(
            seconds / 60
        );


    const remainingSeconds =
        seconds % 60;


    let secondsText =
        remainingSeconds;


    if (
        remainingSeconds < 10
    ) {

        secondsText =
            "0" +
            remainingSeconds;

    }


    return (
        minutes +
        ":" +
        secondsText
    );

}



function updateRewardButton(
    reward
) {

    const button =
        document.getElementById(
            reward.button
        );


    if (
        claimedRewards.includes(
            reward.minutes
        )
    ) {

        button.className =
            "reward claimed";


        button.innerHTML =
            "✅ CLAIMED" +
            "<span>+" +
            reward.xp +
            " XP</span>";


        return;

    }


    if (
        playtimeSeconds >=
        reward.minutes * 60
    ) {

        button.className =
            "reward ready";


        button.innerHTML =
            "🎁 CLAIM!" +
            "<span>+" +
            reward.xp +
            " XP</span>";

    }

    else {

        button.className =
            "reward";


        button.innerHTML =
            "🔒 " +
            reward.minutes +
            " MIN" +
            "<span>+" +
            reward.xp +
            " XP</span>";

    }

}



function updatePlaytimeRewards() {

    document.getElementById(
        "playtime"
    ).textContent =
        "⏱️ Playtime: " +
        formatPlaytime(
            playtimeSeconds
        );


    rewards.forEach(
        function(reward) {

            updateRewardButton(
                reward
            );

        }
    );

}



function claimReward(
    reward
) {

    if (
        claimedRewards.includes(
            reward.minutes
        )
    ) {

        return;

    }


    if (
        playtimeSeconds <
        reward.minutes * 60
    ) {

        return;

    }


    claimedRewards.push(
        reward.minutes
    );


    const oldLevel =
        playerLevel;


    addXP(
        reward.xp
    );


    let message =
        "You earned +" +
        reward.xp +
        " XP!";


    if (
        playerLevel >
        oldLevel
    ) {

        message +=
            "\n\n🎉 LEVEL UP!" +
            "\nYou are now Level " +
            playerLevel +
            "!";

    }


    showPopup(
        "🎁 REWARD CLAIMED!",
        message,
        "Awesome! 😎"
    );


    updatePlaytimeRewards();

}



/* REWARD BUTTON EVENTS */

rewards.forEach(
    function(reward) {

        document.getElementById(
            reward.button
        ).addEventListener(
            "click",
            function() {

                claimReward(
                    reward
                );

            }
        );

    }
);



/* TIMER */

setInterval(
    function() {

        playtimeSeconds++;

        updatePlaytimeRewards();

    },
    1000
);



/* INITIAL DISPLAY */

updateXPDisplay();

updatePlaytimeRewards();

</script>
